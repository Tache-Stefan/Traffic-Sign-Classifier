<!DOCTYPE html>
<html>
<head>
    <title>Traffic Sign Classifier</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">Traffic Sign Classifier</a>
            <div class="ms-auto">
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger">Sign Out</a>
                {% else %}
                    <a href="{{ url_for('auth.register') }}" class="btn btn-outline-success me-2">Register</a>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Upload a Traffic Sign Image</h2>

        <form action="/" method="post" enctype="multipart/form-data" class="text-center">
            <input type="file" name="file" class="form-control w-50 mx-auto mb-3" required>
            <input type="submit" value="Predict" class="btn btn-primary">
        </form>

        {% if filename %}
            <div class="mt-5 text-center">
                <h4>Prediction: {{ prediction }}</h4>
                <h5>Label: {{ label }}</h5>
                <img src="{{ url_for('uploaded_file', filename=filename) }}" alt="Uploaded Image" class="img-thumbnail mt-3" width="250">
            </div>
        {% endif %}
    </div>

</body>
</html>
